name: Publish Neftlix release APK

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore signing keystore
        env:
          NEFTLIX_KEYSTORE_BASE64: ${{ secrets.NEFTLIX_KEYSTORE_BASE64 }}
        run: echo "$NEFTLIX_KEYSTORE_BASE64" | base64 -d > neftlix-release.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          NEFTLIX_KEYSTORE_FILE: ../neftlix-release.keystore
          NEFTLIX_KEYSTORE_PASSWORD: ${{ secrets.NEFTLIX_KEYSTORE_PASSWORD }}
          NEFTLIX_KEY_ALIAS: ${{ secrets.NEFTLIX_KEY_ALIAS }}
          NEFTLIX_KEY_PASSWORD: ${{ secrets.NEFTLIX_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Publish GitHub release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk neftlix-android-tv.apk
          gh release create "${{ github.ref_name }}" --title "Neftlix ${{ github.ref_name }}" --notes "TV APK build from ${{ github.ref_name }}." --latest neftlix-android-tv.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
