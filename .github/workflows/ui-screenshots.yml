name: UI Screenshots (temporary)

# ورک‌فلوی موقت برای بازبینی چشمی طراحی روی امولاتور تلویزیون.
# بعد از تأیید نهایی حذف می‌شود.
on:
  push:
    branches: [ui-redesign]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM (best effort)
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || true

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Boot TV emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: tv_1080p
          avd-name: tv1080
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 1200
          disable-animations: true
          disable-spellchecker: true
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash .github/scripts/ui-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          if-no-files-found: warn
