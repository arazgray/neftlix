plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arazgray.neftlix'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.arazgray.neftlix'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // امضای ثابت برای همه بیلدها تا آپدیت روی نصب قبلی بنشیند؛
    // اگر فایل کی‌استور نباشد (بیلد محلی)، از کلید دیباگ پیش‌فرض استفاده می‌شود.
    signingConfigs {
        neftlix {
            storeFile file(System.getenv("NEFTLIX_KEYSTORE_FILE") ?: "neftlix-release.keystore")
            storePassword System.getenv("NEFTLIX_KEYSTORE_PASSWORD")
            keyAlias System.getenv("NEFTLIX_KEY_ALIAS")
            keyPassword System.getenv("NEFTLIX_KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            if (file(System.getenv("NEFTLIX_KEYSTORE_FILE") ?: "neftlix-release.keystore").exists()) {
                signingConfig signingConfigs.neftlix
            }
        }
        release {
            minifyEnabled false
            if (file(System.getenv("NEFTLIX_KEYSTORE_FILE") ?: "neftlix-release.keystore").exists()) {
                signingConfig signingConfigs.neftlix
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-datasource:1.5.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
